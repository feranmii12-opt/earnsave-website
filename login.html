<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login | EarnSave</title><style>
:root {
    --blue: #075cf5;
    --cyan: #08bde9;
    --text: #171c29;
    --muted: #818b9b;
    --border: #e1e6ee;
    --background: #f7f9fc;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: var(--text);
    background:
        radial-gradient(ellipse at top left, #e0ebff 0%, transparent 42%),
        var(--background);
    display: flex;
    flex-direction: column;
}

header {
    padding: 25px 7%;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 27px;
    font-weight: 900;
    letter-spacing: -1px;
    color: #075cf5;
}

.logo span {
    color: #08bde9;
}

.create-btn {
    text-decoration: none;
    background: white;
    color: #075cf5;
    padding: 14px 22px;
    border-radius: 30px;
    font-weight: bold;
    font-size: 14px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.page {
    flex: 1;
    width: 100%;
    max-width: 700px;
    margin: auto;
    padding: 35px 22px 55px;
}

.welcome {
    margin-bottom: 35px;
}

.welcome h1 {
    font-size: 36px;
    margin: 0 0 12px;
    letter-spacing: -1.2px;
}

.subtitle {
    color: var(--muted);
    font-size: 16px;
    line-height: 1.6;
    margin: 0;
}

.card {
    width: 100%;
    background: white;
    border: 1px solid #e4e8ef;
    border-radius: 30px;
    padding: 35px 30px;
    box-shadow: 0 12px 35px rgba(30,50,90,.07);
}

label {
    display: block;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 12px;
}

.input-wrap {
    position: relative;
    margin-bottom: 26px;
}

.input-icon {
    position: absolute;
    left: 17px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 21px;
    color: #9aa5b5;
    pointer-events: none;
}

input {
    width: 100%;
    height: 65px;
    padding: 0 55px;
    border: 2px solid var(--border);
    border-radius: 19px;
    outline: none;
    background: white;
    color: #202738;
    font-size: 16px;
    transition: .2s;
}

input::placeholder {
    color: #a2aab7;
}

input:focus {
    border-color: #1685ff;
    box-shadow: 0 0 0 4px rgba(7,92,245,.08);
}

.password-input {
    padding-right: 65px;
}

.toggle-password {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    font-size: 20px;
    color: #8c98a9;
    cursor: pointer;
}

.forgot {
    display: block;
    text-align: right;
    margin-top: -12px;
    margin-bottom: 27px;
    font-size: 13px;
    color: #075cf5;
    font-weight: bold;
    text-decoration: none;
}

.login-button {
    width: 100%;
    height: 66px;
    border: none;
    border-radius: 19px;
    color: white;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(100deg, #075cf5, #08bde9);
    box-shadow: 0 12px 25px rgba(7,92,245,.20);
    transition: .2s;
}

.login-button:active {
    transform: scale(.98);
}

.login-button:disabled {
    opacity: .65;
    cursor: wait;
}

.account-link {
    margin-top: 32px;
    text-align: center;
    color: #818b9b;
    font-size: 15px;
}

.account-link a {
    color: #075cf5;
    font-weight: bold;
    text-decoration: none;
}

.message {
    display: none;
    margin-top: 20px;
    padding: 14px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

.message.error {
    display: block;
    color: #c62843;
    background: #fff0f2;
    border: 1px solid #ffd2d9;
}

.message.success {
    display: block;
    color: #087c4c;
    background: #eafff4;
    border: 1px solid #b8f0d2;
}

.security {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid #edf0f4;
    text-align: center;
    font-size: 12px;
    color: #9aa3b1;
    line-height: 1.7;
}

footer {
    padding: 25px 15px;
    text-align: center;
    color: #9aa3b1;
    font-size: 12px;
}

@media(max-width:480px) {
    header {
        padding: 23px 20px;
    }

    .logo {
        font-size: 23px;
    }

    .create-btn {
        padding: 12px 16px;
        font-size: 12px;
    }

    .page {
        padding: 35px 20px 45px;
    }

    .welcome h1 {
        font-size: 31px;
    }

    .subtitle {
        font-size: 14px;
    }

    .card {
        padding: 29px 20px;
        border-radius: 25px;
    }

    input {
        height: 62px;
        font-size: 14px;
    }

    .login-button {
        height: 62px;
        font-size: 17px;
    }
}
</style></head><body><header>
    <div class="logo">EARN<span>SAVE</span></div>
    <a href="register.html" class="create-btn">Create account</a>
</header><main class="page"><div class="welcome">
    <h1>Welcome back</h1>
    <p class="subtitle">
        Sign in to continue to your EarnSave account.
    </p>
</div>

<section class="card">

    <form id="loginForm">

        <label for="loginEmail">Email address</label>

        <div class="input-wrap">
            <span class="input-icon">♙</span>
            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email address"
                autocomplete="email"
                required
            >
        </div>

        <label for="loginPassword">Password</label>

        <div class="input-wrap">
            <span class="input-icon">🔒</span>

            <input
                type="password"
                id="loginPassword"
                class="password-input"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button
                type="button"
                class="toggle-password"
                id="togglePassword"
                aria-label="Show password"
            >◉</button>
        </div>

        <a href="#" class="forgot" id="forgotPassword">
            Forgot password?
        </a>

        <button
            type="submit"
            class="login-button"
            id="loginButton"
        >
            Sign in
        </button>

    </form>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <div class="account-link">
        New to EarnSave?
        <a href="register.html">Create account</a>
    </div>

    <div class="security">
        🔒 Your account is protected.<br>
        Sign in with your registered EarnSave email and password.
    </div>

</section>

</main><footer>
    © <span id="year"></span> EarnSave. All rights reserved.
</footer><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script>
const firebaseConfig = {
    apiKey: "AIzaSyD640twUr5ZAPK7SMPGvJARHv3d1_uLbXY",
    authDomain: "earnsave-e7a88.firebaseapp.com",
    projectId: "earnsave-e7a88",
    storageBucket: "earnsave-e7a88.firebasestorage.app",
    messagingSenderId: "2806298963",
    appId: "1:2806298963:web:f5f6fe584d51c7280be4aa",
    measurementId: "G-3C742ZNKHB"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();

const form = document.getElementById("loginForm");
const emailInput = document.getElementById("loginEmail");
const passwordInput = document.getElementById("loginPassword");
const loginButton = document.getElementById("loginButton");
const message = document.getElementById("message");
const togglePassword = document.getElementById("togglePassword");

document.getElementById("year").textContent =
    new Date().getFullYear();

function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
}

function friendlyError(error) {
    switch (error.code) {
        case "auth/invalid-email":
            return "Please enter a valid email address.";

        case "auth/invalid-credential":
        case "auth/user-not-found":
        case "auth/wrong-password":
            return "Incorrect email or password. Please check your details.";

        case "auth/too-many-requests":
            return "Too many attempts. Please wait before trying again.";

        case "auth/network-request-failed":
            return "Network error. Please check your internet connection.";

        case "auth/user-disabled":
            return "Your account has been disabled. Contact the administrator.";

        case "auth/operation-not-allowed":
            return "Email and password login is not enabled in Firebase.";

        default:
            return "Login failed. Please try again.";
    }
}

// Show or hide password
togglePassword.addEventListener("click", function() {
    const hidden = passwordInput.type === "password";

    passwordInput.type = hidden ? "text" : "password";
    togglePassword.textContent = hidden ? "◎" : "◉";

    togglePassword.setAttribute(
        "aria-label",
        hidden ? "Hide password" : "Show password"
    );
});

// Login
form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
        showMessage("Please enter your email and password.", "error");
        return;
    }

    loginButton.disabled = true;
    loginButton.textContent = "Signing in...";

    message.className = "message";

    try {
        await auth.setPersistence(
            firebase.auth.Auth.Persistence.LOCAL
        );

        await auth.signInWithEmailAndPassword(email, password);

        showMessage(
            "Login successful! Opening your dashboard...",
            "success"
        );

        window.location.replace("dashboard.html");

    } catch (error) {
        console.error("EarnSave login error:", error);

        showMessage(friendlyError(error), "error");

        loginButton.disabled = false;
        loginButton.textContent = "Sign in";
    }
});

// Forgot password
document.getElementById("forgotPassword").addEventListener(
    "click",
    async function(event) {
        event.preventDefault();

        const email = emailInput.value.trim();

        if (!email) {
            showMessage(
                "Enter your email address first, then tap Forgot password.",
                "error"
            );
            emailInput.focus();
            return;
        }

        try {
            await auth.sendPasswordResetEmail(email);

            showMessage(
                "Password reset instructions have been sent if this email is registered. Check your inbox.",
                "success"
            );

        } catch (error) {
            console.error("Password reset error:", error);

            if (error.code === "auth/invalid-email") {
                showMessage("Please enter a valid email address.", "error");
            } else if (error.code === "auth/too-many-requests") {
                showMessage("Too many attempts. Please try again later.", "error");
            } else {
                showMessage(
                    "Could not send the reset email. Please try again.",
                    "error"
                );
            }
        }
    }
);

// Redirect an already signed-in user
auth.onAuthStateChanged(function(user) {
    if (user && window.location.pathname.endsWith("login.html")) {
        window.location.replace("dashboard.html");
    }
});
</script></body>
</html>
