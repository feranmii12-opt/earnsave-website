<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | EarnSave</title>

<style>
:root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --text: #171b26;
    --muted: #8993a4;
    --border: #e1e5eb;
    --input: #ffffff;
    --blue: #075cff;
    --cyan: #08bde9;
}

body.dark {
    --bg: #080d1c;
    --card: #111a30;
    --text: #f4f7ff;
    --muted: #a0abc4;
    --border: #293650;
    --input: #0b1225;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: .3s;
}

.page {
    width: 100%;
    max-width: 430px;
    margin: auto;
    padding: 28px 20px 35px;
}

.heading {
    margin-bottom: 22px;
}

.heading h1 {
    font-size: 25px;
    margin: 0 0 8px;
    font-weight: 800;
}

.heading p {
    font-size: 14px;
    line-height: 1.6;
    color: var(--muted);
    margin: 0;
}

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 19px;
    padding: 24px 19px;
    box-shadow: 0 12px 35px rgba(0,0,0,.06);
}

.name-row {
    display: flex;
    gap: 11px;
}

.name-row .field {
    width: 50%;
    min-width: 0;
}

.field {
    margin-bottom: 17px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 9px;
    color: var(--text);
}

.input-wrap {
    position: relative;
}

input {
    width: 100%;
    height: 49px;
    padding: 0 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--input);
    color: var(--text);
    outline: none;
    font-size: 14px;
    font-family: inherit;
    transition: .2s;
}

input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(7,92,255,.08);
}

input::placeholder {
    color: #a2aab5;
}

.password-input {
    padding-right: 55px;
}

.toggle-password {
    position: absolute;
    right: 13px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 19px;
    color: var(--muted);
}

.register-button {
    width: 100%;
    height: 51px;
    border: none;
    border-radius: 13px;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 5px;
    background: linear-gradient(100deg, #075cff, #08bde9);
    box-shadow: 0 8px 18px rgba(7,92,255,.18);
}

.register-button:disabled {
    opacity: .6;
    cursor: wait;
}

.message {
    display: none;
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

.message.error {
    display: block;
    color: #dc3545;
    background: #fff0f0;
}

.message.success {
    display: block;
    color: #13834d;
    background: #e8fff2;
}

.links {
    margin-top: 21px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    line-height: 2;
}

.links a {
    color: #075cff;
    text-decoration: none;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 25px 15px;
    font-size: 12px;
    color: var(--muted);
}

.theme-button {
    position: fixed;
    right: 16px;
    bottom: 17px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 19px;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

@media(max-width:350px) {
    .page {
        padding: 22px 13px;
    }

    .card {
        padding: 20px 14px;
    }

    .name-row {
        gap: 8px;
    }

    input {
        padding-left: 10px;
        font-size: 13px;
    }
}
</style>
</head>

<body>

<main class="page">

    <div class="heading">
        <h1>Create account</h1>
        <p>Join thousands of others building their future on our platform.</p>
    </div>

    <section class="card">

        <div id="refBox" style="display:none;margin-bottom:16px;padding:12px;background:#eaf3ff;color:#075cff;border-radius:10px;font-size:13px;"></div>

        <form id="registerForm">

            <div class="name-row">

                <div class="field">
                    <label for="firstName">First name</label>
                    <input
                        type="text"
                        id="firstName"
                        placeholder="First name"
                        autocomplete="given-name"
                        required>
                </div>

                <div class="field">
                    <label for="lastName">Last name</label>
                    <input
                        type="text"
                        id="lastName"
                        placeholder="Last name"
                        autocomplete="family-name"
                        required>
                </div>

            </div>

            <div class="field">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Choose username"
                    autocomplete="username"
                    minlength="3"
                    maxlength="30"
                    required>
            </div>

            <div class="field">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required>
            </div>

            <div class="field">
                <label for="phone">Phone number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="08012345678"
                    autocomplete="tel"
                    maxlength="20"
                    required>
            </div>

            <div class="field">
                <label for="referral">Referral (optional)</label>
                <input
                    type="text"
                    id="referral"
                    placeholder="Enter referral code">
            </div>

            <div class="field">
                <label for="password">Password</label>

                <div class="input-wrap">
                    <input
                        type="password"
                        id="password"
                        class="password-input"
                        placeholder="Choose password"
                        autocomplete="new-password"
                        minlength="6"
                        required>

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="password"
                        aria-label="Show password">◉</button>
                </div>
            </div>

            <button
                type="submit"
                id="registerBtn"
                class="register-button">
                Complete registration
            </button>

        </form>

        <div id="message" class="message" role="status" aria-live="polite"></div>

        <div class="links">
            Already have an account?
            <a href="login.html">Sign In</a>
        </div>

    </section>

</main>

<footer>
    © <span id="year"></span> EarnSave. All rights reserved.
    <br><br>
    <a href="support.html" style="color:#075cff;text-decoration:none;font-weight:bold;">Support</a>
</footer>

<button class="theme-button" id="themeButton" aria-label="Toggle dark mode">☾</button>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyD640twUr5ZAPK7SMPGvJARHv3d1_uLbXY",
    authDomain: "earnsave-e7a88.firebaseapp.com",
    projectId: "earnsave-e7a88",
    storageBucket: "earnsave-e7a88.firebasestorage.app",
    messagingSenderId: "2806298963",
    appId: "1:2806298963:web:f5f6fe584d51c7280be4aa",
    measurementId: "G-3C742ZNKHB"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.firestore();

document.getElementById("year").textContent =
    new Date().getFullYear();

const params = new URLSearchParams(window.location.search);

const referralCode = params.get("ref");
const referralUid = params.get("refuid");

const refBox = document.getElementById("refBox");
const referralInput = document.getElementById("referral");

if (referralCode) {
    referralInput.value = referralCode;
}

if (referralCode || referralUid) {
    refBox.style.display = "block";
    refBox.textContent = "You joined EarnSave through a referral link.";
}

// Dark mode

const themeButton = document.getElementById("themeButton");

if (localStorage.getItem("earnsaveTheme") === "dark") {
    document.body.classList.add("dark");
    themeButton.textContent = "☀";
}

themeButton.addEventListener("click", function() {
    document.body.classList.toggle("dark");

    const dark = document.body.classList.contains("dark");

    themeButton.textContent = dark ? "☀" : "☾";

    localStorage.setItem(
        "earnsaveTheme",
        dark ? "dark" : "light"
    );
});

// Show / hide password

document.querySelectorAll(".toggle-password").forEach(function(toggle) {

    toggle.addEventListener("click", function() {

        const input = document.getElementById(toggle.dataset.target);

        const show = input.type === "password";

        input.type = show ? "text" : "password";

        toggle.textContent = show ? "◉" : "◉";

        toggle.setAttribute(
            "aria-label",
            show ? "Hide password" : "Show password"
        );

    });

});

// Messages

const form = document.getElementById("registerForm");
const button = document.getElementById("registerBtn");
const message = document.getElementById("message");

function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
}

function friendlyError(error) {

    switch(error.code) {

        case "auth/email-already-in-use":
            return "This email already has an account. Please sign in.";

        case "auth/invalid-email":
            return "Please enter a valid email address.";

        case "auth/weak-password":
            return "Please choose a stronger password.";

        case "auth/network-request-failed":
            return "Network error. Check your internet connection.";

        case "auth/operation-not-allowed":
            return "Enable email/password registration in Firebase.";

        default:
            return "Registration error: " +
                (error.message || "Please try again.");
    }
}

// Registration

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const firstName = document.getElementById("firstName").value.trim();
    const lastName = document.getElementById("lastName").value.trim();
    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value;

    const enteredReferral = referralInput.value.trim();

    const fullName = firstName + " " + lastName;

    if (!/^[a-zA-Z0-9_]{3,30}$/.test(username)) {
        showMessage(
            "Username must be 3-30 characters and contain only letters, numbers or underscores.",
            "error"
        );
        return;
    }

    if (password.length < 6) {
        showMessage(
            "Password must contain at least 6 characters.",
            "error"
        );
        return;
    }

    button.disabled = true;
    button.textContent = "Creating account...";

    message.className = "message";

    let createdUser = null;

    try {

        await auth.setPersistence(
            firebase.auth.Auth.Persistence.LOCAL
        );

        const result = await auth.createUserWithEmailAndPassword(
            email,
            password
        );

        createdUser = result.user;

        const newReferralCode =
            "ES" + createdUser.uid.substring(0, 8).toUpperCase();

        const userData = {

            firstName: firstName,
            lastName: lastName,
            fullName: fullName,

            username: username,
            email: email,
            phone: phone,

            role: "user",

            balance: 0,
            referralEarnings: 0,

            referralCode: newReferralCode,

            createdAt:
                firebase.firestore.FieldValue.serverTimestamp()

        };

        const finalReferral = enteredReferral || referralCode;

        if (finalReferral) {
            userData.referredBy = finalReferral;
        }

        if (referralUid) {
            userData.referredByUid = referralUid;
        }

        await db.collection("users")
            .doc(createdUser.uid)
            .set(userData);

        showMessage(
            "Your EarnSave account was created successfully!",
            "success"
        );

        form.style.display = "none";

        setTimeout(function() {
            window.location.href = "login.html";
        }, 2200);

    } catch(error) {

        console.error("EarnSave registration error:", error);

        if (createdUser) {

            showMessage(
                "Your login account was created, but your profile could not be saved. Please contact support. Error: " +
                (error.message || error.code),
                "error"
            );

        } else {

            showMessage(friendlyError(error), "error");

        }

        button.disabled = false;
        button.textContent = "Complete registration";

    }

});

</script>

</body>
</html>
