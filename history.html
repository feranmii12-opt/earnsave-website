<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Submission History - EarnSave</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: linear-gradient(135deg, #5b2cff, #2878ff);
            color: white;
            padding: 18px 20px;
        }

        .header-inner {
            max-width: 900px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .back {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 25px auto;
            padding: 0 15px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .submission {
            background: white;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .reward {
            font-weight: bold;
            margin: 8px 0;
        }

        .proof {
            background: #f1f3f7;
            padding: 10px;
            border-radius: 8px;
            word-break: break-word;
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-top: 10px;
        }

        .pending {
            background: #fff3cd;
            color: #856404;
        }

        .approved {
            background: #d4edda;
            color: #155724;
        }

        .rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .date {
            color: #777;
            font-size: 13px;
            margin-top: 10px;
        }

        .empty {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
        }

        .loading {
            text-align: center;
            padding: 30px;
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="logo">EarnSave</div>
        <a class="back" href="dashboard.html">Dashboard</a>
    </div>
</header>

<div class="container">

    <h1>Submission History</h1>

    <div id="loading" class="loading">
        Loading your submissions...
    </div>

    <div id="history"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyD640twUr5ZAPK7SMPGvJARHv3d1_uLbXY",
    authDomain: "earnsave-e7a88.firebaseapp.com",
    projectId: "earnsave-e7a88",
    storageBucket: "earnsave-e7a88.firebasestorage.app",
    messagingSenderId: "280629896863",
    appId: "1:280629896863:web:f5f6fe584d51c7280be4aa",
    measurementId: "G-3C742ZNKHB"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
.then(() => {

    auth.onAuthStateChanged(function(user) {

        if (!user) {
            window.location.href = "login.html";
            return;
        }

        loadHistory(user.uid);
    });

})
.catch(error => {
    console.error(error);
});


function loadHistory(userId) {

    const loading = document.getElementById("loading");
    const history = document.getElementById("history");

    db.collection("submissions")
      .where("userId", "==", userId)
      .get()
      .then(snapshot => {

          loading.style.display = "none";

          if (snapshot.empty) {

              history.innerHTML = `
                  <div class="empty">
                      <h3>No submissions yet</h3>
                      <p>Complete a task and submit proof to see it here.</p>
                  </div>
              `;

              return;
          }

          let submissions = [];

          snapshot.forEach(doc => {

              submissions.push({
                  id: doc.id,
                  ...doc.data()
              });

          });

          // Newest first
          submissions.sort((a, b) => {

              const dateA = a.submittedAt
                  ? a.submittedAt.toMillis()
                  : 0;

              const dateB = b.submittedAt
                  ? b.submittedAt.toMillis()
                  : 0;

              return dateB - dateA;

          });

          history.innerHTML = "";

          submissions.forEach(data => {

              let status = data.status || "pending";

              let statusClass = "pending";

              if (status === "approved") {
                  statusClass = "approved";
              }

              if (status === "rejected") {
                  statusClass = "rejected";
              }

              let dateText = "Date unavailable";

              if (data.submittedAt) {

                  dateText = data.submittedAt
                      .toDate()
                      .toLocaleString();

              }

              const card = document.createElement("div");

              card.className = "submission";

              card.innerHTML = `

                  <div class="title">
                      ${escapeHtml(data.taskTitle || "Task")}
                  </div>

                  <div class="reward">
                      Reward: ₦${Number(data.reward || 0).toLocaleString()}
                  </div>

                  <div>
                      Status:
                      <span class="status ${statusClass}">
                          ${escapeHtml(status.toUpperCase())}
                      </span>
                  </div>

                  <p><strong>Your Proof:</strong></p>

                  <div class="proof">
                      ${escapeHtml(data.proof || "No proof")}
                  </div>

                  <div class="date">
                      Submitted: ${escapeHtml(dateText)}
                  </div>

              `;

              history.appendChild(card);

          });

      })
      .catch(error => {

          console.error(error);

          loading.style.display = "none";

          history.innerHTML = `
              <div class="empty">
                  <h3>Unable to load submissions</h3>
                  <p>${escapeHtml(error.message)}</p>
              </div>
          `;

      });
}


function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
